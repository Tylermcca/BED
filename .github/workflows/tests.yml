name: Tests

# Builds BED and runs every test on a clean Windows machine.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}   # a push to the private copy (skipped there) never cancels a run started by hand
  cancel-in-progress: true

jobs:
  test:
    # The private development copy runs it only when started by hand.
    if: github.repository == 'Tylermcca/BED' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Python test tools
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Build
        run: dotnet build Bed.slnx

      - name: Python checks
        run: python -m pytest -q tools

      - name: C# tests
        run: dotnet test Bed.slnx --no-build --blame-hang-timeout 10m --logger "console;verbosity=minimal"
