name: Tests

# Builds BED and runs every check on a clean Windows machine, then writes what happened in plain words at the top of the run's page.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}   # a push to the private copy (skipped there) never cancels a run started by hand
  cancel-in-progress: true

jobs:
  test:
    name: Build BED and run its checks
    # The private development copy runs it only when started by hand.
    if: github.repository == 'Tylermcca/BED' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Get BED's files
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Python checking tools
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Build BED
        run: dotnet build Bed.slnx

      - name: Check BED's tools and file formats
        run: python -m pytest -q tools

      - name: Check BED itself
        run: dotnet test Bed.slnx --no-build --blame-hang-timeout 10m --logger "console;verbosity=minimal" --logger trx --results-directory TestResults

      - name: Write what happened in plain words
        if: always()
        run: python tools/ci/summary.py TestResults
